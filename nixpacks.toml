# nixpacks.toml for Laravel deployment on Railway

[phases.build]
cmds = [
    "composer install --no-interaction --no-dev --optimize-autoloader",
    "npm install",
    "npm run build"
]

[phases.release]
cmds = [
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache",
    "php artisan migrate --force"
]
